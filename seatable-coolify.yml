---
# SeaTable Server (Developer Edition) adapted for Coolify.
# Paste into Coolify: New Resource -> Docker Compose Empty.
# Set the variables listed at the bottom in Coolify's Environment Variables UI.
# Assign your domain to the `seatable-server` service, port 80.
services:
  seatable-server:
    image: ${SEATABLE_IMAGE:-seatable/seatable-developer:6.2.1}
    restart: unless-stopped
    volumes:
      - seatable_data_v2:/shared
    configs:
      - source: seatable_nginx_conf
        target: /etc/nginx/sites-enabled/default
    environment:
      - SEATABLE_MYSQL_DB_HOST=${MARIADB_HOST:-mariadb}
      - SEATABLE_MYSQL_DB_PORT=${MARIADB_PORT:-3306}
      - SEATABLE_MYSQL_DB_USER=root
      - SEATABLE_MYSQL_DB_PASSWORD=${MARIADB_PASSWORD:?Variable is not set or empty}
      - INIT_SEATABLE_MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-${MARIADB_PASSWORD}}
      - SEATABLE_MYSQL_DB_DTABLE_DB_NAME=dtable_db
      - SEATABLE_MYSQL_DB_CCNET_DB_NAME=ccnet_db
      - SEATABLE_MYSQL_DB_SEAFILE_DB_NAME=seafile_db
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Variable is not set or empty}
      - JWT_PRIVATE_KEY=${JWT_PRIVATE_KEY:?Variable is not set or empty}
      - SECRET_KEY=${SECRET_KEY:?Variable is not set or empty}
      - SEATABLE_SERVER_HOSTNAME=${SEATABLE_SERVER_HOSTNAME:?Variable is not set or empty}
      - SEATABLE_SERVER_PROTOCOL=${SEATABLE_SERVER_PROTOCOL:-https}
      - SEATABLE_ADMIN_EMAIL=${SEATABLE_ADMIN_EMAIL:?Variable is not set or empty}
      - SEATABLE_ADMIN_PASSWORD=${SEATABLE_ADMIN_PASSWORD:?Variable is not set or empty}
      - TIME_ZONE=${TIME_ZONE:?Variable is not set or empty}
      - ENABLE_PYTHON_SCRIPT=${ENABLE_PYTHON_SCRIPT:-false}
      - PYTHON_SCHEDULER_URL=${PYTHON_SCHEDULER_URL:-http://python-scheduler}
      - PYTHON_SCHEDULER_AUTH_TOKEN=${PYTHON_SCHEDULER_AUTH_TOKEN:-}
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - SEATABLE_EMAIL_USE_TLS=${SEATABLE_EMAIL_USE_TLS:-}
      - SEATABLE_EMAIL_USE_SSL=${SEATABLE_EMAIL_USE_SSL:-}
      - SEATABLE_EMAIL_HOST=${SEATABLE_EMAIL_HOST:-}
      - SEATABLE_EMAIL_HOST_USER=${SEATABLE_EMAIL_HOST_USER:-}
      - SEATABLE_EMAIL_HOST_PASSWORD=${SEATABLE_EMAIL_HOST_PASSWORD:-}
      - SEATABLE_EMAIL_PORT=${SEATABLE_EMAIL_PORT:-25}
      - SEATABLE_DEFAULT_FROM_EMAIL=${SEATABLE_DEFAULT_FROM_EMAIL:-}
      - SEATABLE_SERVER_EMAIL=${SEATABLE_SERVER_EMAIL:-}
      - SEATABLE_SHOW_TEMPLATES_LINK=${SEATABLE_SHOW_TEMPLATES_LINK:-}
      - SEATABLE_TEMPLATE_BASE_API_TOKEN=${SEATABLE_TEMPLATE_BASE_API_TOKEN:-}
      - SEATABLE_TEMPLATE_TABLE_NAME=${SEATABLE_TEMPLATE_TABLE_NAME:-}
      - SEATABLE_ENABLE_CREATE_BASE_FROM_TEMPLATE=${SEATABLE_ENABLE_CREATE_BASE_FROM_TEMPLATE:-}
      - SEATABLE_HELP_LINK=${SEATABLE_HELP_LINK:-https://help.seatable.com}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ENABLE_SEATABLE_AI=${ENABLE_SEATABLE_AI:-false}
      - INNER_SEATABLE_AI_SERVER_URL=${INNER_SEATABLE_AI_SERVER_URL:-http://seatable-ai:8888}
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - frontend-net
      - backend-seatable-net
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:8000 || exit 1"]
      interval: 20s
      retries: 3
      start_period: 30s
      timeout: 10s

  mariadb:
    image: ${SEATABLE_DB_IMAGE:-mariadb:11.8.5-noble}
    restart: unless-stopped
    command: ["mariadbd", "--innodb_snapshot_isolation=OFF"]
    environment:
      - MYSQL_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD:-${MARIADB_PASSWORD}}
      - MYSQL_LOG_CONSOLE=true
      - MARIADB_AUTO_UPGRADE=1
      - TZ=${TIME_ZONE}
    volumes:
      - mariadb_data_v2:/var/lib/mysql
    configs:
      - source: mariadb_init_healthcheck
        target: /docker-entrypoint-initdb.d/01-healthcheck-user.sh
        mode: 0755
    networks:
      - backend-seatable-net
    healthcheck:
      test:
        [
          "CMD",
          "/usr/local/bin/healthcheck.sh",
          "--connect",
          "--mariadbupgrade",
          "--innodb_initialized",
        ]
      interval: 20s
      retries: 3
      start_period: 30s
      timeout: 10s
      # On older database containers without healthcheck users present you might need to create them manually,
      # otherwise the container stays unhealthy.
      # more info at https://admin.seatable.com/upgrade/extra-upgrade-notice/

  redis:
    image: ${SEATABLE_REDIS_IMAGE:-redis:8.4.0-bookworm}
    restart: unless-stopped
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?Variable is not set or empty}
    command:
      - /bin/sh
      - -c
      - exec redis-server --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD variable is not set}" --maxmemory "${REDIS_MAX_MEMORY:-500mb}" --maxmemory-policy allkeys-lru
    networks:
      - backend-seatable-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 20s
      retries: 3
      timeout: 5s

networks:
  frontend-net:
    name: frontend-net
  backend-seatable-net:
    name: backend-seatable-net

volumes:
  seatable_data_v2:
  mariadb_data_v2:

configs:
  seatable_nginx_conf:
    content: |
      log_format seatableformat '\$$http_x_forwarded_for \$$remote_addr [\$$time_local] "\$$request" \$$status \$$body_bytes_sent "\$$http_referer" "\$$http_user_agent" \$$upstream_response_time';

      server {
          listen 80;
          listen [::]:80;
          server_name _;

          proxy_set_header X-Forwarded-For $$remote_addr;

          # CORS settings to allow API access from api.seatable.com
          proxy_hide_header 'Access-Control-Allow-Origin';
          add_header 'Access-Control-Allow-Origin' 'https://api.seatable.com' always;
          add_header 'Access-Control-Allow-Methods' 'GET,POST,PUT,DELETE,OPTIONS' always;
          add_header 'Access-Control-Allow-Headers' 'Content-Type, Accept, authorization, token, deviceType, x-seafile-otp' always;
          if ($$request_method = 'OPTIONS') {
      	    return 204;
          }

          location / {
              proxy_pass         http://127.0.0.1:8000;
              proxy_set_header   Host $$host;
              proxy_set_header   X-Real-IP $$remote_addr;
              proxy_set_header   X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Host $$server_name;
              proxy_read_timeout  1200s;
              client_max_body_size 0;

              access_log      /opt/nginx-logs/dtable-web.access.log seatableformat;
              error_log       /opt/nginx-logs/dtable-web.error.log;
          }

          location /seafhttp {
              rewrite ^/seafhttp(.*)$$ $$1 break;
              proxy_pass http://127.0.0.1:8082;

              proxy_set_header   X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_request_buffering off;
              proxy_connect_timeout  36000s;
              proxy_read_timeout  36000s;
              proxy_send_timeout  36000s;
              send_timeout  36000s;
              client_max_body_size 0;

              access_log      /opt/nginx-logs/seafhttp.access.log seatableformat;
              error_log       /opt/nginx-logs/seafhttp.error.log;
          }

          location /media {
              root /opt/seatable/seatable-server-latest/dtable-web;
              access_log off;
              error_log off;
          }

          location /api-gateway/ {
              proxy_pass         http://127.0.0.1:7780/;
              proxy_redirect     off;
              proxy_set_header   Host              $$http_host;
              proxy_set_header   X-Real-IP         $$remote_addr;
              proxy_set_header   X-Forwarded-For   $$proxy_add_x_forwarded_for;
              proxy_set_header   X-Forwarded-Host  $$server_name;
              proxy_set_header   X-Forwarded-Proto $$scheme;

              proxy_hide_header Access-Control-Allow-Origin;
              proxy_hide_header Access-Control-Allow-Methods;
              proxy_hide_header Access-Control-Allow-Headers;

              client_max_body_size 10m;

              access_log      /opt/nginx-logs/api-gateway.access.log seatableformat;
              error_log       /opt/nginx-logs/api-gateway.error.log;
          }

          location /api-gateway/socket.io/ {
              proxy_pass http://127.0.0.1:7780/socket.io/;

      	    # websocket proxying
              proxy_http_version 1.1;
              proxy_set_header Upgrade $$http_upgrade;
              proxy_set_header Connection upgrade;

              proxy_redirect off;
              proxy_buffers 8 32k;
              proxy_buffer_size 64k;
              proxy_set_header X-Real-IP $$remote_addr;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header Host $$http_host;
              proxy_set_header X-NginX-Proxy true;

              access_log      /opt/nginx-logs/socket-io.access.log seatableformat;
              error_log       /opt/nginx-logs/socket-io.error.log;
          }

          location /internal-thumbnails/ {
              internal;
              alias /opt/seatable/seahub-data/thumbnail/;

              add_header X-Served-By "Nginx-via-X-Accel";
              expires 7d;
              add_header Cache-Control "public, no-transform";

              access_log /opt/nginx-logs/internal-thumbnails.access.log seatableformat;
              error_log /opt/nginx-logs/internal-thumbnails.error.log;
          }

          # Deprecated endpoints
          location /dtable-server {
      	    return 404 'This endpoint is deprecated. Please migrate to the API Gateway: https://forum.seatable.com/t/important-changes-to-the-seatable-cloud-api-in-version-5-3/6677';
          }

          location /dtable-db {
              return 404 'This endpoint is deprecated. Please migrate to the API Gateway: https://forum.seatable.com/t/important-changes-to-the-seatable-cloud-api-in-version-5-3/6677';
          }

          # ping endpoints
          location = /dtable-server/ping/ {
              proxy_pass http://127.0.0.1:5000/ping/;
          }

          location = /dtable-db/ping/ {
              proxy_pass http://127.0.0.1:7777/ping/;
          }
      }
  mariadb_init_healthcheck:
    content: |
      #!/bin/bash
      # Creates the MariaDB health check user and credentials file required by
      # the official healthcheck.sh. Runs only on first init of an empty datadir.
      set -euo pipefail

      PW=$$(tr -dc 'A-Za-z0-9' </dev/urandom | head -c 20 || true)

      mariadb -u root -p"$${MYSQL_ROOT_PASSWORD}" -e "
      CREATE USER IF NOT EXISTS 'healthcheck'@'localhost' IDENTIFIED BY '$${PW}';
      CREATE USER IF NOT EXISTS 'healthcheck'@'127.0.0.1' IDENTIFIED BY '$${PW}';
      CREATE USER IF NOT EXISTS 'healthcheck'@'::1' IDENTIFIED BY '$${PW}';
      CREATE USER IF NOT EXISTS 'healthcheck'@'%' IDENTIFIED BY '$${PW}';
      GRANT USAGE ON *.* TO 'healthcheck'@'localhost';
      GRANT USAGE ON *.* TO 'healthcheck'@'127.0.0.1';
      GRANT USAGE ON *.* TO 'healthcheck'@'::1';
      GRANT USAGE ON *.* TO 'healthcheck'@'%';
      FLUSH PRIVILEGES;"

      printf "[mariadb-client]\nport=3306\nsocket=/run/mysqld/mysqld.sock\nuser=healthcheck\npassword=%s\nprotocol=tcp\n" "$${PW}" > /var/lib/mysql/.my-healthcheck.cnf

      echo "healthcheck user created"
